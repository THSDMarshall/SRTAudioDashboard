<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMC22 Safari Output Routing Test</title><style>body{font:16px system-ui;max-width:720px;margin:auto;padding:20px;background:#101827;color:#fff}button,select{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:9px}button{background:#38bdf8;border:0}select{background:#334155;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#020617;padding:12px;border-radius:8px;font-size:12px}p{line-height:1.5;color:#cbd5e1}</style><h1>UMC22 Output Routing Test</h1><p>Connect UMC22, turn amplifier volume low, and open this file via HTTPS in Safari.</p><button id="scan">1. Allow microphone and find outputs</button><select id="outputs"><option value="">System default</option></select><button id="test">2. Play tone on selected output</button><button id="bridge">3. Test Web Audio mixer bridge</button><button id="stop">Stop sound</button><button id="copy">Copy report</button><pre id="log"></pre><script>
const $=x=>document.getElementById(x),log=(...a)=>{$('log').textContent+=new Date().toLocaleTimeString()+' '+a.map(v=>typeof v==='string'?v:JSON.stringify(v)).join(' ')+'\n'};let mic=null,player=null,ctx=null,wavUrl=null;
function stop(){try{player?.pause();player?.removeAttribute('src');player.srcObject=null;player?.load()}catch(e){}try{ctx?.close()}catch(e){}player=null;ctx=null}
function wav(){let rate=22050,n=rate*3,b=new ArrayBuffer(44+2*n),v=new DataView(b);function str(i,s){for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j))}str(0,'RIFF');v.setUint32(4,36+2*n,true);str(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,2*rate,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,2*n,true);for(let i=0;i<n;i++){let fade=Math.min(1,i/400,(n-i)/400);v.setInt16(44+i*2,Math.sin(2*Math.PI*440*i/rate)*1900*fade,true)}return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
async function route(a){let id=$('outputs').value;log('Selected', $('outputs').selectedOptions[0]?.textContent,'HTMLAudioElement.setSinkId',typeof a.setSinkId);if(id){if(typeof a.setSinkId!=='function')throw Error('HTML audio setSinkId unavailable');await a.setSinkId(id);log('setSinkId SUCCESS',{sinkId:a.sinkId?'assigned':'empty'})}else log('Using system default')}
$('scan').onclick=async()=>{try{if(!mic){mic=await navigator.mediaDevices.getUserMedia({audio:true});log('Microphone permission granted',mic.getAudioTracks().map(t=>t.label))}let devices=await navigator.mediaDevices.enumerateDevices(),sel=$('outputs');sel.innerHTML='<option value="">System default</option>';for(let d of devices){log('Device',{kind:d.kind,label:d.label,id:d.deviceId?'present':'absent'});if(d.kind==='audiooutput'){let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Unnamed output';sel.append(o)}}log('Output options',sel.options.length-1);let usb=[...sel.options].find(o=>/USB Audio CODEC/i.test(o.textContent));if(usb){sel.value=usb.value;log('Automatically selected USB Audio CODEC')}}catch(e){log('SCAN ERROR',e.name,e.message)}};
$('test').onclick=async()=>{stop();try{player=new Audio();await route(player);if(!wavUrl)wavUrl=wav();player.src=wavUrl;await player.play();log('HTML audio tone PLAYING — listen to UMC22 outputs')}catch(e){log('HTML TEST ERROR',e.name,e.message)}};
$('bridge').onclick=async()=>{stop();try{ctx=new AudioContext();let dest=ctx.createMediaStreamDestination(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=440;gain.gain.value=.06;osc.connect(gain).connect(dest);player=new Audio();player.srcObject=dest.stream;await route(player);await ctx.resume();osc.start();osc.stop(ctx.currentTime+3);await player.play();log('WEB AUDIO BRIDGE PLAYING — listen to UMC22 outputs');osc.onended=()=>stop()}catch(e){log('BRIDGE ERROR',e.name,e.message)}};
$('stop').onclick=()=>{stop();log('Stopped')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent);log('Report copied')}catch(e){log('COPY ERROR',e.name,e.message)}};
log('Secure context',isSecureContext);log('HTMLAudioElement.setSinkId',typeof HTMLAudioElement.prototype.setSinkId);log('AudioContext.setSinkId',typeof AudioContext.prototype.setSinkId);
</script></html>
